<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not Another Thriftstore - Order & Profit Tracker</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --danger: #dc2626;
      --success: #059669;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    h1 { margin: 0 0 8px; }
    h2 { margin: 0 0 12px; font-size: 1.1rem; }
    .muted { color: var(--muted); }
    .error { color: var(--danger); margin-top: 8px; font-size: 0.9rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
    }

    button {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { opacity: 0.95; }
    button.delete { background: var(--danger); border-color: var(--danger); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .summary-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: #fafafa;
    }

    .summary-item strong {
      display: block;
      margin-top: 4px;
      font-size: 1.1rem;
    }

    .profit-positive { color: var(--success); }
    .profit-negative { color: var(--danger); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.92rem;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .status {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
      display: inline-block;
      border: 1px solid;
    }

    .status-dispatched {
      color: var(--success);
      border-color: #a7f3d0;
      background: #ecfdf5;
    }

    .status-pending {
      color: #b45309;
      border-color: #fcd34d;
      background: #fffbeb;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      min-width: 180px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Not Another Thriftstore</h1>
      <p class="muted">Track orders, costs, revenue, dispatch status, and monthly profit totals.</p>
    </div>

    <div class="card">
      <h2>Punch a New Order</h2>
      <form id="orderForm" class="grid">
        <div>
          <label for="customerName">Customer Name</label>
          <input id="customerName" name="customerName" required />
        </div>
        <div>
          <label for="itemName">Item</label>
          <input id="itemName" name="itemName" required />
        </div>
        <div>
          <label for="orderDate">Order Date</label>
          <input id="orderDate" name="orderDate" type="date" required />
        </div>
        <div>
          <label for="cost">Cost</label>
          <input id="cost" name="cost" type="number" min="0" step="0.01" required />
        </div>
        <div>
          <label for="revenue">Sale Price</label>
          <input id="revenue" name="revenue" type="number" min="0" step="0.01" required />
        </div>
        <div>
          <label for="dispatched">Dispatch Status</label>
          <select id="dispatched" name="dispatched">
            <option value="false">Not Dispatched</option>
            <option value="true">Dispatched</option>
          </select>
        </div>
        <div style="align-self:end;">
          <button type="submit">Add Order</button>
        </div>
      </form>
      <p id="formError" class="error" role="alert" aria-live="polite"></p>
    </div>

    <div class="card">
      <h2>Month-End Summary</h2>
      <div class="grid" style="margin-bottom: 12px;">
        <div>
          <label for="summaryMonth">Select Month</label>
          <input id="summaryMonth" name="summaryMonth" type="month" aria-label="Select Month" />
        </div>
      </div>
      <div class="summary-grid">
        <div class="summary-item">
          Total Cost
          <strong id="totalCost">$0.00</strong>
        </div>
        <div class="summary-item">
          Total Revenue
          <strong id="totalRevenue">$0.00</strong>
        </div>
        <div class="summary-item">
          Total Profit
          <strong id="totalProfit">$0.00</strong>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Orders</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order #</th>
              <th>Customer</th>
              <th>Item</th>
              <th>Date</th>
              <th>Cost</th>
              <th>Revenue</th>
              <th>Profit</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'not-another-thriftstore-orders';
    const ORDER_TIMESTAMP_LENGTH = 17;
    const ORDER_SUFFIX_LENGTH = 8;

    const form = document.getElementById('orderForm');
    const orderDateInput = document.getElementById('orderDate');
    const tableBody = document.getElementById('ordersTableBody');
    const monthInput = document.getElementById('summaryMonth');
    const totalCostEl = document.getElementById('totalCost');
    const totalRevenueEl = document.getElementById('totalRevenue');
    const totalProfitEl = document.getElementById('totalProfit');
    const formError = document.getElementById('formError');

    function getDefaultMonth() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    function getCurrentDateString() {
      return new Date().toISOString().split('T')[0];
    }

    function isValidISODate(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
      const date = new Date(`${value}T00:00:00Z`);
      return !Number.isNaN(date.getTime()) && date.toISOString().startsWith(value);
    }

    function getOrders() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        const parsed = data ? JSON.parse(data) : [];
        if (!Array.isArray(parsed)) return [];
        return parsed.filter((order) => {
          if (!order || typeof order !== 'object') return false;
          const validDate = typeof order.orderDate === 'string' && isValidISODate(order.orderDate);
          const validNums = Number.isFinite(Number(order.cost)) && Number.isFinite(Number(order.revenue));
          return validDate && validNums;
        }).map((order) => ({
          ...order,
          cost: Number(order.cost),
          revenue: Number(order.revenue),
          dispatched: Boolean(order.dispatched)
        }));
      } catch {
        return [];
      }
    }

    function saveOrders(orders) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
    }

    function currency(value) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(value || 0);
    }

    function generateOrderNumber(existingNumbers) {
      const now = new Date();
      // Keep YYYYMMDDHHmmssSSS for readable timestamp plus milliseconds.
      const stamp = now.toISOString().replace(/[-:.TZ]/g, '').slice(0, ORDER_TIMESTAMP_LENGTH);
      let orderNumber = '';
      do {
        // Append UUID chars for stronger uniqueness while keeping readable timestamp.
        const suffix = crypto.randomUUID().replace(/-/g, '').slice(0, ORDER_SUFFIX_LENGTH).toUpperCase();
        orderNumber = `NATS-${stamp}-${suffix}`;
      } while (existingNumbers.has(orderNumber));
      return orderNumber;
    }

    function parseNumber(value) {
      const num = Number(value);
      return Number.isFinite(num) ? num : 0;
    }

    function createCell(text, className) {
      const cell = document.createElement('td');
      cell.textContent = text;
      if (className) cell.className = className;
      return cell;
    }

    function render() {
      const orders = getOrders();
      const selectedMonth = monthInput.value || getDefaultMonth();

      tableBody.innerHTML = '';

      for (const order of orders) {
        const row = document.createElement('tr');
        const profit = order.revenue - order.cost;
        row.appendChild(createCell(order.orderNumber));
        row.appendChild(createCell(order.customerName));
        row.appendChild(createCell(order.itemName));
        row.appendChild(createCell(order.orderDate));
        row.appendChild(createCell(currency(order.cost)));
        row.appendChild(createCell(currency(order.revenue)));
        row.appendChild(createCell(currency(profit), profit >= 0 ? 'profit-positive' : 'profit-negative'));

        const statusCell = document.createElement('td');
        const status = document.createElement('span');
        status.className = `status ${order.dispatched ? 'status-dispatched' : 'status-pending'}`;
        status.textContent = order.dispatched ? 'Dispatched' : 'Not Dispatched';
        statusCell.appendChild(status);
        row.appendChild(statusCell);

        const actionsCell = document.createElement('td');
        const actions = document.createElement('div');
        actions.className = 'actions';

        const toggleButton = document.createElement('button');
        toggleButton.type = 'button';
        toggleButton.dataset.action = 'toggle';
        toggleButton.dataset.id = order.id;
        toggleButton.textContent = 'Toggle Status';

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.dataset.action = 'delete';
        deleteButton.dataset.id = order.id;
        deleteButton.className = 'delete';
        deleteButton.textContent = 'Delete';

        actions.appendChild(toggleButton);
        actions.appendChild(deleteButton);
        actionsCell.appendChild(actions);
        row.appendChild(actionsCell);
        tableBody.appendChild(row);
      }

      const monthlyOrders = orders.filter((order) => order.orderDate.startsWith(selectedMonth));
      const totalCost = monthlyOrders.reduce((sum, order) => sum + order.cost, 0);
      const totalRevenue = monthlyOrders.reduce((sum, order) => sum + order.revenue, 0);
      const totalProfit = totalRevenue - totalCost;

      totalCostEl.textContent = currency(totalCost);
      totalRevenueEl.textContent = currency(totalRevenue);
      totalProfitEl.textContent = currency(totalProfit);
      totalProfitEl.className = totalProfit >= 0 ? 'profit-positive' : 'profit-negative';
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      formError.textContent = '';
      const orders = getOrders();
      const orderNumbers = new Set(orders.map((order) => order.orderNumber));

      const formData = new FormData(form);
      const newOrder = {
        id: crypto.randomUUID(),
        orderNumber: generateOrderNumber(orderNumbers),
        customerName: String(formData.get('customerName') || '').trim(),
        itemName: String(formData.get('itemName') || '').trim(),
        orderDate: String(formData.get('orderDate') || ''),
        cost: parseNumber(formData.get('cost')),
        revenue: parseNumber(formData.get('revenue')),
        dispatched: String(formData.get('dispatched')) === 'true'
      };

      if (!newOrder.customerName || !newOrder.itemName || !newOrder.orderDate) {
        formError.textContent = 'Please enter customer name, item, and order date.';
        return;
      }

      orders.unshift(newOrder);
      saveOrders(orders);
      form.reset();
      orderDateInput.value = getCurrentDateString();
      render();
    });

    tableBody.addEventListener('click', (event) => {
      const target = event.target;
      if (!(target instanceof HTMLButtonElement)) return;

      const action = target.dataset.action;
      const id = target.dataset.id;
      if (!action || !id) return;

      const orders = getOrders();
      const index = orders.findIndex((o) => o.id === id);
      if (index === -1) return;

      if (action === 'toggle') {
        orders[index].dispatched = !orders[index].dispatched;
      }

      if (action === 'delete') {
        orders.splice(index, 1);
      }

      saveOrders(orders);
      render();
    });

    monthInput.addEventListener('change', render);

    monthInput.value = getDefaultMonth();
    orderDateInput.value = getCurrentDateString();
    render();
  </script>
</body>
</html>
