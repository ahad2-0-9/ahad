<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily To-Do</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --good: #16a34a;
      --warn: #f59e0b;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .app {
      max-width: 860px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
    }

    h1, h2 { margin: 0 0 10px; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1rem; color: var(--muted); }

    .sub { color: var(--muted); font-size: 0.92rem; }

    .row {
      display: grid;
      grid-template-columns: 1fr 170px auto;
      gap: 10px;
    }

    input, button, select {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      background: #fff;
      color: var(--text);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:active { transform: scale(0.96); }
    button:hover { filter: brightness(1.05); }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border-color: var(--line);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      background: #fff;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .reminder {
      border-left: 4px solid var(--warn);
      background: #fffaf0;
    }

    .hidden { display: none; }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .task {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      background: #fff;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .task:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
    }

    .task.done {
      opacity: 0.82;
      background: #f8fffa;
    }

    .task-title {
      font-weight: 600;
      margin: 0;
    }

    .task-meta {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .strike { text-decoration: line-through; }
    .late { color: var(--danger); }

    .new-task { animation: popIn 0.3s ease; }
    .click-done { animation: donePulse 0.25s ease; }

    @keyframes popIn {
      from { transform: scale(0.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes donePulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      background: #fff;
    }

    .stat strong { font-size: 1.2rem; display: block; }

    .history li {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: #fff;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.9rem;
    }

    @media (max-width: 680px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>To-Do List</h1>
      <p class="sub">Minimal app, daily tracking, and next-day reminders for missed tasks.</p>
      <form id="taskForm" class="row">
        <input id="taskInput" maxlength="180" placeholder="Add a task you need to do" required />
        <input id="dueInput" type="date" />
        <button type="submit">Add Task</button>
      </form>
      <div class="toolbar">
        <button type="button" class="btn-ghost" id="showAll">All</button>
        <button type="button" class="btn-ghost" id="showOpen">Open</button>
        <button type="button" class="btn-ghost" id="showDone">Done</button>
        <button type="button" class="btn-ghost" id="clearDone">Clear Completed</button>
        <button type="button" class="btn-ghost" id="downloadData">Download Data</button>
      </div>
    </section>

    <section id="reminderCard" class="card reminder hidden">
      <h2>Reminder for Today</h2>
      <p id="reminderText" class="sub"></p>
      <ul id="reminderList"></ul>
    </section>

    <section class="card">
      <h2>Your Tasks</h2>
      <ul id="taskList"></ul>
    </section>

    <section class="card">
      <h2>Daily Work Log</h2>
      <div class="stats">
        <div class="stat"><span>Today Completed</span><strong id="todayCount">0</strong></div>
        <div class="stat"><span>Total Tasks</span><strong id="totalCount">0</strong></div>
        <div class="stat"><span>Open Tasks</span><strong id="openCount">0</strong></div>
      </div>
      <div style="height:10px"></div>
      <ul id="historyList" class="history"></ul>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'todo-minimal-v1';
    const DAY_MS = 24 * 60 * 60 * 1000;
    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const dueInput = document.getElementById('dueInput');
    const taskList = document.getElementById('taskList');
    const reminderCard = document.getElementById('reminderCard');
    const reminderText = document.getElementById('reminderText');
    const reminderList = document.getElementById('reminderList');
    const historyList = document.getElementById('historyList');

    let filterMode = 'all';

    function todayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function parseDate(dateStr) {
      const [y, m, d] = (dateStr || '').split('-').map(Number);
      if (!y || !m || !d) return null;
      return new Date(y, m - 1, d);
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { tasks: [], dailyLog: {} };
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.tasks) || typeof parsed.dailyLog !== 'object' || parsed.dailyLog === null) {
          return { tasks: [], dailyLog: {} };
        }
        return parsed;
      } catch {
        return { tasks: [], dailyLog: {} };
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function createTaskNode(task) {
      const li = document.createElement('li');
      li.className = 'task new-task' + (task.done ? ' done' : '');
      li.dataset.id = task.id;

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.done;
      checkbox.setAttribute('aria-label', `Mark ${task.title} as done`);

      const content = document.createElement('div');
      const title = document.createElement('p');
      title.className = 'task-title' + (task.done ? ' strike' : '');
      title.textContent = task.title;

      const meta = document.createElement('p');
      meta.className = 'task-meta';
      const dueText = task.dueDate ? `Due: ${task.dueDate}` : 'No due date';
      const overdue = !task.done && task.dueDate && parseDate(task.dueDate) < parseDate(todayStr());
      if (overdue) {
        meta.classList.add('late');
        meta.textContent = `${dueText} · Missed`;
      } else {
        meta.textContent = dueText;
      }

      content.appendChild(title);
      content.appendChild(meta);

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn-ghost';
      delBtn.textContent = 'Delete';

      checkbox.addEventListener('change', () => toggleTaskDone(task.id, li));
      delBtn.addEventListener('click', () => deleteTask(task.id));

      li.appendChild(checkbox);
      li.appendChild(content);
      li.appendChild(delBtn);
      return li;
    }

    function addToDailyLog(state, task) {
      const day = todayStr();
      if (!state.dailyLog[day]) state.dailyLog[day] = [];
      const exists = state.dailyLog[day].some((item) => item.taskId === task.id);
      if (!exists) {
        state.dailyLog[day].unshift({ taskId: task.id, title: task.title, completedAt: new Date().toISOString() });
      }
    }

    function removeFromDailyLog(state, taskId) {
      for (const day of Object.keys(state.dailyLog)) {
        state.dailyLog[day] = state.dailyLog[day].filter((item) => item.taskId !== taskId);
        if (state.dailyLog[day].length === 0) delete state.dailyLog[day];
      }
    }

    function toggleTaskDone(id, node) {
      const state = loadState();
      const task = state.tasks.find((t) => t.id === id);
      if (!task) return;
      task.done = !task.done;
      if (task.done) {
        task.completedOn = todayStr();
        addToDailyLog(state, task);
        node.classList.add('click-done');
        setTimeout(() => node.classList.remove('click-done'), 260);
      } else {
        task.completedOn = null;
        removeFromDailyLog(state, id);
      }
      saveState(state);
      render();
    }

    function deleteTask(id) {
      const state = loadState();
      state.tasks = state.tasks.filter((t) => t.id !== id);
      removeFromDailyLog(state, id);
      saveState(state);
      render();
    }

    function renderReminder(tasks) {
      const today = parseDate(todayStr());
      const missed = tasks.filter((t) => !t.done && t.dueDate && parseDate(t.dueDate) < today);
      reminderList.innerHTML = '';

      if (missed.length === 0) {
        reminderCard.classList.add('hidden');
        return;
      }

      reminderCard.classList.remove('hidden');
      reminderText.textContent = `You missed ${missed.length} task${missed.length > 1 ? 's' : ''}. Continue them today.`;

      missed.slice(0, 5).forEach((task) => {
        const item = document.createElement('li');
        item.className = 'task';
        const p = document.createElement('p');
        p.className = 'task-title';
        p.textContent = `${task.title} (due ${task.dueDate})`;
        item.appendChild(p);
        reminderList.appendChild(item);
      });
    }

    function renderStats(state) {
      const today = todayStr();
      const todayDone = state.dailyLog[today] || [];
      const total = state.tasks.length;
      const open = state.tasks.filter((t) => !t.done).length;

      document.getElementById('todayCount').textContent = String(todayDone.length);
      document.getElementById('totalCount').textContent = String(total);
      document.getElementById('openCount').textContent = String(open);

      historyList.innerHTML = '';
      const days = Object.keys(state.dailyLog).sort((a, b) => (a < b ? 1 : -1)).slice(0, 7);
      if (days.length === 0) {
        const li = document.createElement('li');
        li.textContent = 'No completed work yet. Finish a task to build your daily log.';
        historyList.appendChild(li);
        return;
      }

      days.forEach((day) => {
        const li = document.createElement('li');
        const left = document.createElement('span');
        left.textContent = day;
        const right = document.createElement('span');
        right.textContent = `${state.dailyLog[day].length} done`;
        li.appendChild(left);
        li.appendChild(right);
        historyList.appendChild(li);
      });
    }

    function render() {
      const state = loadState();
      taskList.innerHTML = '';
      let tasks = [...state.tasks];

      if (filterMode === 'open') tasks = tasks.filter((t) => !t.done);
      if (filterMode === 'done') tasks = tasks.filter((t) => t.done);

      tasks.sort((a, b) => {
        if (!!a.done !== !!b.done) return a.done ? 1 : -1;
        if (!a.dueDate && !b.dueDate) return 0;
        if (!a.dueDate) return 1;
        if (!b.dueDate) return -1;
        return a.dueDate < b.dueDate ? -1 : 1;
      });

      for (const task of tasks) {
        taskList.appendChild(createTaskNode(task));
      }

      renderReminder(state.tasks);
      renderStats(state);
    }

    function addTask(title, dueDate) {
      const state = loadState();
      const task = {
        id: crypto.randomUUID(),
        title,
        dueDate: dueDate || '',
        createdOn: todayStr(),
        done: false,
        completedOn: null
      };
      state.tasks.unshift(task);
      saveState(state);
      render();
    }

    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = taskInput.value.trim();
      const dueDate = dueInput.value;
      if (!title) return;
      addTask(title, dueDate);
      taskInput.value = '';
      dueInput.value = '';
      taskInput.focus();
    });

    document.getElementById('showAll').addEventListener('click', () => { filterMode = 'all'; render(); });
    document.getElementById('showOpen').addEventListener('click', () => { filterMode = 'open'; render(); });
    document.getElementById('showDone').addEventListener('click', () => { filterMode = 'done'; render(); });

    document.getElementById('clearDone').addEventListener('click', () => {
      const state = loadState();
      const doneIds = new Set(state.tasks.filter((t) => t.done).map((t) => t.id));
      state.tasks = state.tasks.filter((t) => !doneIds.has(t.id));
      Object.keys(state.dailyLog).forEach((day) => {
        state.dailyLog[day] = state.dailyLog[day].filter((entry) => !doneIds.has(entry.taskId));
        if (state.dailyLog[day].length === 0) delete state.dailyLog[day];
      });
      saveState(state);
      render();
    });

    document.getElementById('downloadData').addEventListener('click', () => {
      const state = loadState();
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `todo-backup-${todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    dueInput.value = todayStr();
    render();
  </script>
</body>
</html>
